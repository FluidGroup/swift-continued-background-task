name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version
      - name: Run lifecycle tests
        run: swift test
      - name: Build demo for iOS Simulator
        run: >-
          xcodebuild -project Development/Demo.xcodeproj -scheme Demo
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .build/Demo CODE_SIGNING_ALLOWED=NO build
